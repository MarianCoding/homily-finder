name: Transcribe episodes

# Transcription now happens on Ryan's Mac (large-v3-turbo, far more accurate
# than small.en, and not blocked by Podbean). This job is kept for emergencies
# only -- run it by hand from the Actions tab if ever needed.
on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Batches of 10 episodes to transcribe this run"
        default: "8"

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install faster-whisper
      - name: Transcribe in batches, committing as we go
        run: |
          git config user.name "homily-finder bot"
          git config user.email "bot@users.noreply.github.com"
          export SKIP_FILE=/tmp/failed-keys.txt
          export PYTHONUNBUFFERED=1
          for i in $(seq 1 ${{ github.event.inputs.batches || '8' }}); do
            MAX_EPISODES=10 python scripts/transcribe.py
            node scripts/build.js
            git add -A transcripts episodes.json searchindex
            git diff --cached --quiet || git commit -m "Transcribe batch"
            git pull --rebase -X theirs origin main
            git push
          done
