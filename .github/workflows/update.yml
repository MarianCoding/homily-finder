name: Refresh episodes

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC (5am Central)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.js
      - name: Commit episodes.json
        run: |
          git config user.name "homily-finder bot"
          git config user.email "bot@users.noreply.github.com"
          git add episodes.json
          git diff --cached --quiet || git commit -m "Refresh episodes"
          git push
